# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/1d4b87bc427e4cf61c0ef49623c971b0e2224708/schema.json
cv:
  name: Some Person
  location: Austria
  email: some.person@domain.tld
  phone: +43-676-123456
  photo: null
  sections:
    Bildung:
      - institution: TU Wien
        area: Informatik
        degree: BSc
        date:
        start_date: 2017-10
        end_date: 2024-10
        location: Linz
    Berufserfahrung:
      - company: foobar
        position: test
        date:
        start_date: 2020-08
        end_date: 2022-01
        location: Linz
        summary:
        highlights:
          - test
    skills:
      - label: Programmiersprachen
        details: Java, Python
    sprachen:
      - label: Deutsch
        details: Erstsprache
      - label: Englisch
        details: C1
      - label: Französisch
        details: B1
      - label: Italienisch
        details: A1
design:
  theme: classic
  header:
    photo_width: 3.5cm
    connections:
      phone_number_format: international
  page:
    size: a4
    show_footer: true
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(143,188,143)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  templates:
    footer: PAGE_NUMBER/TOTAL_PAGES
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE

locale:
  language: german
  present: laufend
  month_abbreviations:
    - Jän.
    - Feb.
    - Mär.
    - Apr.
    - Mai.
    - Jun.
    - Jul.
    - Aug.
    - Sept.
    - Okt.
    - Nov.
    - Dez.

settings:
  bold_keywords: []
